<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <title>WellBets</title>
</head>
<body>
    <header>
        <p class="logo">WELLBETS 2026</p>
        <img src="./src/assets/logo.png" alt="logo">
    </header>

<main id="container">

    <div class="conteudo">

        <div class="jogos">
            <h2>Próximas Partidas</h2>

            <section class="card">
                <div class="card-game">
                    <article class="bolao">
                        <h3>Brasil VS Haiti</h3>
                        <h3>21/06 - 21:30</h3>
                        <div>
                            <p><input type="number" min="0" max="10" placeholder="Brasil" id="time1-1"></p>
                            <p><input type="number" min="0" max="10" placeholder="Haiti" id="time2-1"></p>
                        </div>
                        <button onclick="salvarPalpite('Brasil vs Haiti', 1)" class="btn-palpite">Palpite</button>
                    </article>
                </div>

                <div class="card-game">
                    <article class="bolao">
                        <h3>Holanda VS Japão</h3>
                        <h3>15/06 - 16:00</h3>
                        <div>
                             <p><input type="number" min="0" max="10" placeholder="Holanda" id="time1-2"></p>
                             <p><input type="number" min="0" max="10" placeholder="Japão" id="time2-2"></p>
                        </div>
                        <button onclick="salvarPalpite('Holanda vs Japão', 2)" class="btn-palpite">Palpite</button>
                    </article>
                </div>
            </section>
        </div>

        <div class="area-historico">
            <h2>Histórico de Palpites</h2>

            <div class="historico">
                <img src="./src/assets/historico.png" alt="historico">

                <ul id="lista-resultados"></ul>
            </div>
        </div>

    </div>

</main>

    <footer>
        <p>&copy - 2026 - BOLÃO</p>
    </footer>

    <script src="./src/js/script.js"></script>
</body>
</html>
